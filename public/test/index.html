<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek · 代理控制台</title>
  <link rel="stylesheet" href="../common/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="dot" id="dot"></span>
      <div class="brand-text">
        <h1>DeepSeek · 代理控制台</h1>
      </div>
    </div>

    <div class="controls">
      <label class="field">
        <span>端点</span>
        <select id="endpoint-select">
          <option value="/v1/chat/completions">OpenAI · /v1/chat/completions</option>
          <option value="/v1/messages">Anthropic · /v1/messages</option>
          <option value="/api/v0/chat/completion">Native · /api/v0/chat/completion</option>
        </select>
      </label>

      <label class="field grow">
        <span>chat_session_id</span>
        <input id="session-input" type="text" placeholder="从配置页读取，或手动填写（native 必填）" autocomplete="off" />
      </label>

      <div class="toggles">
        <label class="switch" title="thinking_enabled：是否开启思考">
          <input id="thinking-switch" type="checkbox" />
          <span class="track"></span>
          <span class="switch-text">thinking</span>
        </label>

        <label class="switch" title="search_enabled：是否开启联网搜索">
          <input id="search-switch" type="checkbox" />
          <span class="track"></span>
          <span class="switch-text">search</span>
        </label>

        <label class="switch" title="在每条回复下显示上游原始 SSE">
          <input id="raw-switch" type="checkbox" />
          <span class="track"></span>
          <span class="switch-text">原始 SSE</span>
        </label>
      </div>

      <button id="btn-clear" class="btn" type="button">清空</button>

      <span id="status-text" class="status-text">就绪</span>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="chat-inner" id="chat-inner">
      <div class="empty" id="empty">
        <div class="empty-icon">💬</div>
        <p class="empty-title">输入一句话开始测试</p>
        <p class="empty-sub">请求会经本地代理转发到上游。<br />
          chat_session_id 会从配置页自动读取，也可手动修改。</p>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <div class="thumbs" id="thumbs" hidden></div>

      <div class="input-row">
        <button id="btn-attach" class="btn icon-btn" type="button" title="添加图片（仅兼容端点）" aria-label="添加图片">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
          </svg>
        </button>
        <input id="file-input" type="file" accept="image/*" multiple hidden />

        <div class="textarea-wrap">
          <textarea id="prompt" rows="1" placeholder="输入内容，Enter 发送，Shift+Enter 换行"></textarea>
          <span id="image-hint" class="image-hint"></span>
        </div>

        <button id="btn-send" class="btn primary send-btn" type="button">
          发送
          <kbd>↵</kbd>
        </button>
      </div>
    </div>
  </footer>

  <script src="./app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代理测试 · DeepSeek</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #8b94a7;
      --accent: #4f8cff;
      --danger: #ff5f6d;
      --ok: #33d17a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { display: flex; flex-direction: column; }

    .topbar {
      flex: 0 0 auto;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .topbar .field { display: flex; gap: 6px; align-items: center; flex: 1 1 auto; min-width: 0; }
    .topbar label { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
    .topbar input[type="text"] {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 7px; padding: 5px 8px; font-size: 12.5px; outline: none;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      flex: 1 1 auto; min-width: 0;
    }
    .topbar input:focus { border-color: var(--accent); }
    .switch { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
    .switch input { accent-color: var(--accent); }
    .btn {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
      white-space: nowrap;
    }
    .btn:hover { border-color: #3a4150; background: #232833; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #6aa0ff; border-color: #6aa0ff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .status {
      font-size: 12px; color: var(--muted);
      padding: 4px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
    .status .dot.ok { background: var(--ok); }
    .status .dot.err { background: var(--danger); }

    .chat { flex: 1 1 auto; overflow-y: auto; padding: 20px 16px; }
    .chat-inner { max-width: 820px; margin: 0 auto; }
    .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 13px; }

    .msg { margin-bottom: 18px; display: flex; }
    .msg.user { justify-content: flex-end; }
    .msg .wrap { max-width: 88%; min-width: 0; }
    .role { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
    .msg.user .role { text-align: right; }
    .bubble {
      background: var(--panel); border: 1px solid var(--border);
      padding: 10px 13px; border-radius: 10px;
      white-space: pre-wrap; word-break: break-word;
      font-size: 14px; line-height: 1.7;
    }
    .msg.user .bubble { background: var(--accent); border-color: var(--accent); color: #fff; }
    .bubble.error { border-color: var(--danger); color: var(--danger); }
    .bubble.pending::after {
      content: ''; display: inline-block; width: 8px; height: 8px;
      background: var(--muted); border-radius: 50%; margin-left: 6px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

    .raw-block { margin-top: 8px; }
    .raw-block summary { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
    .raw {
      margin-top: 6px; max-height: 260px; overflow: auto;
      background: #0b0d11; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11.5px; color: #b9c1d0; white-space: pre-wrap; word-break: break-all;
    }

    .composer {
      flex: 0 0 auto;
      border-top: 1px solid var(--border); background: var(--panel);
      padding: 10px 14px;
    }
    .composer .inner { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea {
      flex: 1 1 auto; resize: none; min-height: 42px; max-height: 180px;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none;
      font-family: inherit; line-height: 1.5;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer .btn.primary { padding: 10px 18px; border-radius: 10px; font-size: 13px; }
    .tip { color: var(--muted); font-size: 11.5px; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="field">
      <label for="session-input">chat_session_id</label>
      <input id="session-input" type="text" placeholder="从配置页读取，或手动填写" autocomplete="off" />
    </div>
    <button id="btn-clear" class="btn" type="button">清空</button>
    <label class="switch" title="在每条回复下显示上游原始 SSE">
      <input id="raw-switch" type="checkbox" /> 显示原始
    </label>
  </div>

  <div class="status">
    <span class="dot" id="dot"></span><span id="status-text">就绪</span>
  </div>

  <div class="chat" id="chat">
    <div class="chat-inner" id="chat-inner">
      <div class="empty" id="empty">
        输入一句话开始测试。<br/>
        请求会经本地代理转发到上游。<br/>
        <span style="color:#5c6678">chat_session_id 会从配置页自动读取，也可手动修改</span>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="inner">
      <textarea id="prompt" rows="1" placeholder="输入内容，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="btn-send" class="btn primary" type="button">发送</button>
    </div>
    <div class="tip">
      <label class="switch"><input id="thinking-switch" type="checkbox" /> thinking_enabled</label>
      &nbsp;&nbsp;
      <label class="switch"><input id="search-switch" type="checkbox" /> search_enabled</label>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const state = {
    sessionId: sessionStorage.getItem('ds_session_id') || '',
    busy: false,
    raw: false,
    controller: null,
  };

  const SESSION_STORE = 'ds_session_id';

  /* ---------- 初始化 UI ---------- */

  $('session-input').value = state.sessionId;

  $('session-input').addEventListener('input', () => {
    state.sessionId = $('session-input').value.trim();
    sessionStorage.setItem(SESSION_STORE, state.sessionId);
  });

  $('raw-switch').addEventListener('change', (e) => {
    state.raw = e.target.checked;
    document.querySelectorAll('.raw-block').forEach((el) => {
      el.hidden = !state.raw;
    });
  });

  $('btn-clear').addEventListener('click', () => {
    $('chat-inner').innerHTML =
      '<div class="empty" id="empty">输入一句话开始测试。<br/>请求会经本地代理转发到上游。</div>';
  });

  $('btn-send').addEventListener('click', send);

  $('prompt').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  $('prompt').addEventListener('input', () => {
    const el = $('prompt');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  });

  /* ---------- 从配置页加载默认 session id ---------- */

  async function loadConfig() {
    try {
      const res = await fetch('/admin/api/config');
      const data = await res.json();
      const cfgId = data?.config?.chatSessionId || '';
      if (cfgId && !state.sessionId) {
        state.sessionId = cfgId;
        $('session-input').value = cfgId;
        sessionStorage.setItem(SESSION_STORE, cfgId);
      }
    } catch {
      /* 配置接口不可用时忽略 */
    }
  }

  /* ---------- 工具函数 ---------- */

  function setStatus(text, cls) {
    $('status-text').textContent = text;
    $('dot').className = 'dot ' + (cls || '');
  }

  function scrollBottom() {
    const chat = $('chat');
    chat.scrollTop = chat.scrollHeight;
  }

  function addMessage(role, text) {
    const empty = $('empty');
    if (empty) empty.remove();

    const msg = document.createElement('div');
    msg.className = 'msg ' + role;

    const wrap = document.createElement('div');
    wrap.className = 'wrap';

    const roleEl = document.createElement('div');
    roleEl.className = 'role';
    roleEl.textContent = role === 'user' ? '我' : 'assistant';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    wrap.append(roleEl, bubble);

    if (role === 'assistant') {
      const rawBlock = document.createElement('details');
      rawBlock.className = 'raw-block';
      rawBlock.hidden = !state.raw;
      rawBlock.open = false;
      const summary = document.createElement('summary');
      summary.textContent = '原始 SSE';
      const raw = document.createElement('div');
      raw.className = 'raw';
      raw.textContent = '';
      rawBlock.append(summary, raw);
      wrap.appendChild(rawBlock);
      msg._raw = raw;
    }

    msg.appendChild(wrap);
    msg._bubble = bubble;
    $('chat-inner').appendChild(msg);
    scrollBottom();
    return msg;
  }

  /* ---------- 文本提取 ---------- */

  function extractText(obj) {
    if (typeof obj === 'string') return obj;
    if (Array.isArray(obj)) return obj.map(extractText).join('');
    if (!obj || typeof obj !== 'object') return '';

    const { p, o, v } = obj;

    // BATCH 批量操作
    if (o === 'BATCH' && Array.isArray(v)) {
      return v.map(extractText).join('');
    }

    // 初始响应对象
    if (
      v &&
      typeof v === 'object' &&
      v.response &&
      Array.isArray(v.response.fragments)
    ) {
      return v.response.fragments
        .map((f) => (typeof f.content === 'string' ? f.content : ''))
        .join('');
    }

    // 显式追加
    if (typeof v === 'string' && typeof p === 'string') {
      if (p.endsWith('/content') || p === 'response/content') {
        return o === 'APPEND' || o === 'SET' ? v : '';
      }
      return '';
    }

    // 隐式追加（无 p）
    if (typeof v === 'string' && p === undefined) {
      return v;
    }

    // OpenAI 兼容
    const delta = obj.choices?.[0]?.delta?.content;
    if (typeof delta === 'string') return delta;

    const message = obj.choices?.[0]?.message?.content;
    if (typeof message === 'string') return message;

    if (typeof obj.content === 'string') return obj.content;
    if (typeof obj.text === 'string') return obj.text;

    return '';
  }

  function extractBizError(obj) {
    if (!obj || typeof obj !== 'object') return null;
    if (
      obj.data &&
      typeof obj.data.biz_code === 'number' &&
      obj.data.biz_code !== 0
    ) {
      return obj.data.biz_msg || `biz_code=${obj.data.biz_code}`;
    }
    if (typeof obj.code === 'number' && obj.code !== 0 && obj.msg) {
      return `code=${obj.code} ${obj.msg}`;
    }
    return null;
  }

  /* ---------- 发送 ---------- */

  async function send() {
    if (state.busy) return;

    const input = $('prompt');
    const prompt = input.value.trim();
    if (!prompt) return;

    if (!state.sessionId) {
      setStatus('请先在配置页填写 chat_session_id，或在上方手动输入', 'err');
      $('session-input').focus();
      return;
    }

    state.busy = true;
    $('btn-send').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', prompt);
    const assistant = addMessage('assistant', '');
    assistant._bubble.classList.add('pending');

    setStatus('请求中…', '');

    const controller = new AbortController();
    state.controller = controller;

    let acc = '';
    const rawLines = [];
    let lastPaint = 0;
    let bizError = null;

    const paint = (force) => {
      const now = performance.now();
      if (!force && now - lastPaint < 50) return;
      lastPaint = now;
      assistant._bubble.textContent = acc;
      scrollBottom();
    };

    const pushRaw = (line) => {
      rawLines.push(line);
      if (state.raw) {
        const view = rawLines.slice(-2000).join('\n');
        assistant._raw.textContent = view;
      }
    };

    const handleData = (data) => {
      if (!data) return;
      if (data === '[DONE]') return;
      pushRaw(data);

      let obj;
      try {
        obj = JSON.parse(data);
      } catch {
        return;
      }

      const err = extractBizError(obj);
      if (err) {
        bizError = err;
        return;
      }

      const text = extractText(obj);
      if (text) {
        acc += text;
        paint(false);
      }
    };

    const processEvent = (chunk) => {
      const lines = chunk.split('\n');
      const dataLines = [];
      for (const line of lines) {
        if (line.startsWith('data:')) {
          dataLines.push(line.slice(5).replace(/^ /, ''));
        }
      }
      if (dataLines.length) handleData(dataLines.join('\n'));
    };

    try {
      const res = await fetch('/api/v0/chat/completion', {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'content-type': 'application/json',
        },
        body: JSON.stringify({
          chat_session_id: state.sessionId,
          parent_message_id: null,
          model_type: 'default',
          prompt,
          ref_file_ids: [],
          thinking_enabled: $('thinking-switch').checked,
          search_enabled: $('search-switch').checked,
          action: null,
          preempt: false,
        }),
      });

      setStatus('HTTP ' + res.status, res.ok ? '' : 'err');

      if (!res.ok) {
        const text = await res.text();
        assistant._bubble.classList.remove('pending');
        assistant._bubble.classList.add('error');
        assistant._bubble.textContent =
          `[HTTP ${res.status}]\n` + text.slice(0, 1200);
        return;
      }

      if (!res.body) {
        const text = await res.text();
        assistant._bubble.textContent = text || '(空响应)';
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');

        let idx;
        while ((idx = buffer.indexOf('\n\n')) !== -1) {
          const chunk = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          processEvent(chunk);
        }
      }

      buffer += decoder.decode();
      if (buffer.trim()) processEvent(buffer.replace(/\r\n/g, '\n'));

      paint(true);

      if (bizError) {
        assistant._bubble.classList.add('error');
        assistant._bubble.textContent = acc
          ? acc + `\n\n[业务错误] ${bizError}`
          : `[业务错误] ${bizError}`;
        setStatus('业务错误', 'err');
        return;
      }

      if (!acc) {
        assistant._bubble.textContent =
          '(未解析出文本，请打开"显示原始"查看上游数据)';
      }

      setStatus('完成', 'ok');
    } catch (e) {
      assistant._bubble.classList.remove('pending');
      if (e.name === 'AbortError') {
        assistant._bubble.textContent = acc || '(已取消)';
        setStatus('已取消', 'err');
      } else {
        assistant._bubble.classList.add('error');
        assistant._bubble.textContent = '[请求异常] ' + e.message;
        setStatus('请求异常', 'err');
      }
    } finally {
      assistant._bubble.classList.remove('pending');
      state.busy = false;
      state.controller = null;
      $('btn-send').disabled = false;
      paint(true);
    }
  }

  window.addEventListener('error', (e) => {
    setStatus('脚本错误：' + e.message, 'err');
  });

  /* ---------- 启动 ---------- */

  loadConfig();
})();
</script>
</body>
</html>
